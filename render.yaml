services:
  - type: web
    name: interview-chatbot
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://interview-chatbot.vercel.app
      - key: PYTHON_VERSION
        value: 3.11.0
